<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Valley to the Mountain logo">
  <defs>
    <linearGradient id="vtm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8cd72"/>
      <stop offset="1" stop-color="#b8902a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#0b0c10" stroke="url(#vtm-gold)" stroke-width="2"/>
  <!-- mountain -->
  <path d="M14 44 L28 22 L36 33 L41 27 L52 44 Z" fill="none" stroke="url(#vtm-gold)" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- summit cap -->
  <path d="M24.5 29 L28 22 L31.5 29 Z" fill="url(#vtm-gold)"/>
  <!-- winding road from valley to peak -->
  <path d="M22 50 C 30 47, 26 41, 32 39 C 38 37, 30 31, 28 24" fill="none" stroke="#3f9d6d" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
